<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARTEX — Обратная связь</title>
  
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <header class="site-header">
    <div class="container">
      <div class="row align-items-center py-3">
        <div class="col-12 text-center text-md-left">
          <a href="#" class="logo-link d-inline-block align-middle mr-2">
            <img src="logo.png" alt="Логотип" class="logo">
          </a>
          <h1 class="m-0 d-inline-block align-middle">ARTEX</h1>
        </div>
      </div>
    </div>
  </header>

  <main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <button id="open-feedback" class="btn btn-danger btn-lg">Связаться с нами</button>
  </main>

  <div id="feedback-modal" class="modal-overlay">
    <div class="modal-content block">
      <span id="close-feedback" class="close-btn">&times;</span>
      <h2>Обратная связь</h2>
      
      <form id="feedback-form" class="mt-3">
        <div class="form-group">
          <label for="fio">ФИО:</label>
          <input type="text" id="fio" name="fio" class="form-control" 
                 pattern="^[A-Za-zА-Яа-яЁё\s\-]+$" 
                 title="Только буквы, пробелы и дефисы" required>
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label for="phone">Телефон:</label>
          <input type="tel" id="phone" name="phone" class="form-control" 
                 pattern="^[\d+\(\)\s\-]{10,}$" 
                 title="Только цифры, +, -, (, ), пробел" required>
        </div>
        <div class="form-group">
          <label for="org">Организация:</label>
          <input type="text" id="org" name="organization" class="form-control">
        </div>
        <div class="form-group">
          <label for="message">Сообщение:</label>
          <textarea id="message" name="message" class="form-control" rows="3" required></textarea>
        </div>
        <div class="form-check mb-3">
          <input type="checkbox" id="agree" name="agreement" class="form-check-input" required>
          <label for="agree" class="form-check-label" style="color: #dcdcdc;">Согласен с политикой обработки данных</label>
        </div>
        
        <button type="submit" id="submit-btn" class="btn btn-danger w-100">Отправить</button>
      </form>
      
      <div id="form-status" class="mt-3 text-center font-weight-bold"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
